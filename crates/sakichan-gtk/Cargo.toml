[package]
name = "sakichan-gtk"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "sakichan-gtk"
path = "src/main.rs"

[dependencies]
gtk4     = { version = "0.9", features = ["v4_12"] }
gdk4     = "0.9"
glib     = "0.20"
gio      = "0.20"
sakichan-core = { path = "../sakichan-core" }
tokio    = { version = "1", features = ["full"] }
anyhow   = "1"
base64   = "0.22"
chrono   = "0.4"
keyring  = "2"
serde_json = "1"
async-channel = "2"
pulldown-cmark = "0.12"
