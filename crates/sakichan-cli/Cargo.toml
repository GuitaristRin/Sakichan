[package]
name = "sakichan-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
sakichan-core = { path = "../sakichan-core" }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
keyring = "2"
dirs = "5"
colored = "2"
serde_json = "1"
chrono = "0.4"
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
base64 = "0.22"